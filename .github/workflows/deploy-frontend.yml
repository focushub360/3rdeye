name: Deploy Frontend to AWS S3 + CloudFront

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '3W-WHEELERTVS-FRONTEND/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 3W-WHEELERTVS-FRONTEND/package-lock.json

      - name: Install dependencies
        working-directory: 3W-WHEELERTVS-FRONTEND
        run: npm ci

      - name: Build Vite app
        working-directory: 3W-WHEELERTVS-FRONTEND
        run: npm run build
        env:
          NODE_ENV: production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Sync dist/ to S3 (assets with long cache)
        run: |
          aws s3 sync 3W-WHEELERTVS-FRONTEND/dist/ s3://${{ secrets.S3_BUCKET_FRONTEND }} \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload index.html to S3 (no cache)
        run: |
          aws s3 cp 3W-WHEELERTVS-FRONTEND/dist/index.html \
            s3://${{ secrets.S3_BUCKET_FRONTEND }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Copy dist to EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "3W-WHEELERTVS-FRONTEND/dist"
          target: "/tmp"

      - name: Deploy Frontend to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 300s
          script: |
            echo "📦 Locating active frontend webroots on EC2..."
            ASSET_FILE=$(find /var/www /home/ubuntu -name "index-*.js" 2>/dev/null | head -n 1)
            if [ -n "$ASSET_FILE" ]; then
              TARGET_DIR=$(dirname $(dirname "$ASSET_FILE"))
              echo "Active webroot found at: $TARGET_DIR"
              if [ -d "/tmp/3W-WHEELERTVS-FRONTEND/dist" ]; then
                sudo cp -r /tmp/3W-WHEELERTVS-FRONTEND/dist/* "$TARGET_DIR/"
              fi
            fi

            # Check Nginx document roots
            NGINX_ROOTS=$(sudo nginx -T 2>/dev/null | grep -E "^\s*root " | awk '{print $2}' | tr -d ';' | sort -u)
            for r in $NGINX_ROOTS; do
              if [ -d "$r" ] && [ -d "/tmp/3W-WHEELERTVS-FRONTEND/dist" ]; then
                echo "Copying to Nginx root: $r"
                sudo cp -r /tmp/3W-WHEELERTVS-FRONTEND/dist/* "$r/"
              fi
            done

            # Update repository dist if folder exists
            if [ -d "/home/ubuntu/3rdeye/3W-WHEELERTVS-FRONTEND" ]; then
              mkdir -p /home/ubuntu/3rdeye/3W-WHEELERTVS-FRONTEND/dist
              if [ -d "/tmp/3W-WHEELERTVS-FRONTEND/dist" ]; then
                cp -r /tmp/3W-WHEELERTVS-FRONTEND/dist/* /home/ubuntu/3rdeye/3W-WHEELERTVS-FRONTEND/dist/
              else
                cd /home/ubuntu/3rdeye/3W-WHEELERTVS-FRONTEND
                git pull origin main
                npm install
                npm run build
              fi
            fi

            sudo nginx -t && sudo systemctl reload nginx
            echo "✅ Frontend deployed to EC2 and Nginx reloaded!"

      - name: Done
        run: echo "✅ Frontend deployed successfully to CloudFront and EC2!"
