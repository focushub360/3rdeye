name: Deploy Frontend to AWS S3 + CloudFront

on:
  push:
    branches:
      - main
    paths:
      - '3W-WHEELERTVS-FRONTEND/**'

jobs:
  deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 3W-WHEELERTVS-FRONTEND/package-lock.json

      - name: Install dependencies
        working-directory: 3W-WHEELERTVS-FRONTEND
        run: npm ci

      - name: Build Vite app
        working-directory: 3W-WHEELERTVS-FRONTEND
        run: npm run build
        env:
          NODE_ENV: production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Sync dist/ to S3 (assets with long cache)
        run: |
          aws s3 sync 3W-WHEELERTVS-FRONTEND/dist/ s3://${{ secrets.S3_BUCKET_FRONTEND }} \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload index.html to S3 (no cache)
        run: |
          aws s3 cp 3W-WHEELERTVS-FRONTEND/dist/index.html \
            s3://${{ secrets.S3_BUCKET_FRONTEND }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Done
        run: echo "✅ Frontend deployed successfully to CloudFront!"
