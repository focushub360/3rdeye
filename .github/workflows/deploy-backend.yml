name: Deploy Backend to AWS EC2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '3w-wheeler-backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    name: Deploy Backend via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 10m
          script: |
            echo "📦 Pulling latest code..."
            if [ -d "/home/ubuntu/3rdeye" ]; then
              cd /home/ubuntu/3rdeye
              git stash || true
              git pull origin main
            elif [ -d "/home/ubuntu/3w-wheeler-backend" ]; then
              cd /home/ubuntu/3w-wheeler-backend
              git stash || true
              git pull origin main
            fi

            cd /home/ubuntu/3rdeye/3w-wheeler-backend || cd /home/ubuntu/3w-wheeler-backend

            echo "📥 Installing backend dependencies..."
            export PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
            export PUPPETEER_SKIP_DOWNLOAD=true
            npm install --omit=dev --prefer-offline --no-audit

            echo "⚙️ Configuring production to use local Lightsail MongoDB..."
            sed -i 's|^MONGODB_URI=.*|MONGODB_URI=mongodb://app_user:YourSecurePassword123@127.0.0.1:27017/3wheelertvs_dev?authSource=3wheelertvs_dev|' .env

            echo "♻️ Restarting backend with PM2 Cluster..."
            pm2 reload ecosystem.config.cjs || pm2 start ecosystem.config.cjs
            pm2 save

            echo "🌐 Reloading Nginx..."
            sudo nginx -t && sudo systemctl reload nginx || sudo systemctl restart nginx
            echo "✅ Backend deployment complete!"
            pm2 status
