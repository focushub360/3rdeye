name: Deploy Backend to AWS EC2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '3w-wheeler-backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    name: Deploy Backend via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 120s
          script: |
            echo "📦 Pulling latest backend code..."
            cd /home/ubuntu/3rdeye/3w-wheeler-backend || cd /home/ubuntu/3w-wheeler-backend
            git pull origin main

            echo "📥 Installing dependencies..."
            npm install --omit=dev

            echo "♻️ Restarting backend with PM2 Cluster..."
            pm2 reload ecosystem.config.cjs || pm2 start ecosystem.config.cjs
            pm2 save

            echo "🔍 Finding active frontend asset..."
            FRONTEND_FILE=$(find /var/www /home/ubuntu -name "index-1SVDXeCg.js" 2>/dev/null | head -n 1)
            echo "Old frontend asset located at: $FRONTEND_FILE"

            echo "🌐 Inspecting active Nginx root locations..."
            sudo nginx -T 2>/dev/null | grep -E "server_name|root " | head -n 20

            echo "📦 Building & syncing frontend on EC2..."
            if [ -d "/home/ubuntu/3rdeye/3W-WHEELERTVS-FRONTEND" ]; then
              cd /home/ubuntu/3rdeye/3W-WHEELERTVS-FRONTEND
              git pull origin main
              npm install
              npm run build
              if [ -n "$FRONTEND_FILE" ]; then
                TARGET_DIR=$(dirname $(dirname "$FRONTEND_FILE"))
                echo "Syncing dist to active directory: $TARGET_DIR"
                sudo cp -r dist/* "$TARGET_DIR/"
              fi
            elif [ -d "/var/www/3W-WHEELERTVS-FRONTEND" ]; then
              cd /var/www/3W-WHEELERTVS-FRONTEND
              git pull origin main
              npm install
              npm run build
            fi

            echo "🌐 Reloading Nginx..."
            sudo nginx -t && sudo systemctl reload nginx
            echo "✅ Deployment complete!"
            pm2 status
