    <script>
      // Polyfill crypto.randomUUID for non-secure HTTP contexts (e.g. IP addresses)
      if (typeof window !== "undefined") {
        if (!window.crypto) {
          window.crypto = {};
        }
        if (typeof window.crypto.randomUUID !== "function") {
          window.crypto.randomUUID = function () {
            return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, function (c) {
              return (
                c ^
                (window.crypto.getRandomValues
                  ? window.crypto.getRandomValues(new Uint8Array(1))[0]
                  : (Math.random() * 16) | 0) &
                  (15 >> (c / 4))
              ).toString(16);
            });
          };
        }
      }
      // Safe fallback for .startsWith on non-string objects/values
      if (typeof Object.prototype.startsWith === "undefined") {
        Object.defineProperty(Object.prototype, "startsWith", {
          value: function (search, pos) {
            if (typeof this === "string") return String.prototype.startsWith.call(this, search, pos);
            try {
              if (this && typeof this.id === "string") return this.id.startsWith(search, pos);
              if (this && typeof this.url === "string") return this.url.startsWith(search, pos);
              return String(this).startsWith(search, pos);
            } catch (e) {
              return false;
            }
          },
          configurable: true,
          writable: true,
        });
      }
    </script>
